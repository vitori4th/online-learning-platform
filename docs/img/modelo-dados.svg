<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="860" height="480" fill="#ffffff"/>

  <!-- users -->
  <g stroke="#000000" stroke-width="1.4" fill="#ffffff">
    <rect x="30" y="120" width="270" height="110"/>
    <line x1="30" y1="148" x2="300" y2="148"/>
  </g>
  <g fill="#000000">
    <text x="165" y="139" text-anchor="middle" font-weight="bold" font-size="14">users</text>
    <text x="42" y="168">PK  id : integer</text>
    <text x="42" y="188">name : varchar</text>
    <text x="42" y="208">UK  email : varchar</text>
    <text x="42" y="226">subscriptionId : varchar</text>
  </g>

  <!-- enrollCourse -->
  <g stroke="#000000" stroke-width="1.4" fill="#ffffff">
    <rect x="30" y="340" width="270" height="110"/>
    <line x1="30" y1="368" x2="300" y2="368"/>
  </g>
  <g fill="#000000">
    <text x="165" y="359" text-anchor="middle" font-weight="bold" font-size="14">enrollCourse</text>
    <text x="42" y="388">PK  id : integer</text>
    <text x="42" y="408">FK  cid : varchar</text>
    <text x="42" y="428">FK  userEmail : varchar</text>
    <text x="42" y="446">completedChapters : json</text>
  </g>

  <!-- courses -->
  <g stroke="#000000" stroke-width="1.4" fill="#ffffff">
    <rect x="530" y="20" width="300" height="300"/>
    <line x1="530" y1="48" x2="830" y2="48"/>
  </g>
  <g fill="#000000">
    <text x="680" y="39" text-anchor="middle" font-weight="bold" font-size="14">courses</text>
    <text x="542" y="68">PK  id : integer</text>
    <text x="542" y="88">UK  cid : varchar (identificador público)</text>
    <text x="542" y="108">name : varchar</text>
    <text x="542" y="128">description : varchar</text>
    <text x="542" y="148">duration : varchar</text>
    <text x="542" y="168">noOfChapters : integer</text>
    <text x="542" y="188">includeVideo : boolean</text>
    <text x="542" y="208">level : varchar</text>
    <text x="542" y="228">category : varchar</text>
    <text x="542" y="248">courseJson : json (estrutura)</text>
    <text x="542" y="268">bannerImageUrl : varchar (capa)</text>
    <text x="542" y="288">courseContent : json (conteúdo)</text>
    <text x="542" y="308">FK  userEmail : varchar</text>
  </g>

  <!-- Relacionamentos -->
  <g stroke="#000000" stroke-width="1.3" fill="none">
    <line x1="300" y1="175" x2="530" y2="175"/>
    <line x1="165" y1="230" x2="165" y2="340"/>
    <line x1="530" y1="300" x2="300" y2="395"/>
  </g>
  <g fill="#000000" font-size="12">
    <text x="308" y="168">1</text>
    <text x="516" y="168">N</text>
    <text x="415" y="194" text-anchor="middle">cria (por e-mail)</text>

    <text x="173" y="246">1</text>
    <text x="173" y="334">N</text>
    <text x="178" y="290">matricula-se (por e-mail)</text>

    <text x="516" y="296">1</text>
    <text x="308" y="388">N</text>
    <text x="440" y="368" text-anchor="middle">recebe matrículas (por cid)</text>
  </g>
</svg>
