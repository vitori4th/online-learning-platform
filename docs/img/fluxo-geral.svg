<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1200" height="150" fill="#ffffff"/>
  <g stroke="#000000" stroke-width="1.4" fill="#ffffff">
    <rect x="20" y="30" width="166" height="90" rx="6"/>
    <rect x="216" y="30" width="166" height="90" rx="6"/>
    <rect x="412" y="30" width="166" height="90" rx="6"/>
    <rect x="608" y="30" width="166" height="90" rx="6"/>
    <rect x="804" y="30" width="166" height="90" rx="6"/>
    <rect x="1000" y="30" width="166" height="90" rx="6"/>
  </g>
  <g stroke="#000000" stroke-width="1.3" marker-end="url(#seta)">
    <line x1="186" y1="75" x2="216" y2="75"/>
    <line x1="382" y1="75" x2="412" y2="75"/>
    <line x1="578" y1="75" x2="608" y2="75"/>
    <line x1="774" y1="75" x2="804" y2="75"/>
    <line x1="970" y1="75" x2="1000" y2="75"/>
  </g>
  <g text-anchor="middle" fill="#000000">
    <text x="103" y="71">Formulário</text>
    <text x="103" y="89">de criação</text>

    <text x="299" y="62" font-weight="bold">Etapa 1</text>
    <text x="299" y="80">IA gera estrutura</text>
    <text x="299" y="98">e capa</text>

    <text x="495" y="71">Revisão da estrutura</text>
    <text x="495" y="89">pelo autor</text>

    <text x="691" y="62" font-weight="bold">Etapa 2</text>
    <text x="691" y="80">IA gera o conteúdo</text>
    <text x="691" y="98">dos capítulos</text>

    <text x="887" y="62">Curso disponível:</text>
    <text x="887" y="80">matrícula e</text>
    <text x="887" y="98">exploração</text>

    <text x="1083" y="62">Leitura e marcação</text>
    <text x="1083" y="80">de capítulos</text>
    <text x="1083" y="98">concluídos</text>
  </g>
