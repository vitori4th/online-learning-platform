<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="Helvetica, Arial, sans-serif">
  <!-- Reprodução da Figura 3 do artigo (TikZ): 1 cm = 60 px; x' = (x + 1.2) * 60; y' = (8.2 - y) * 60 -->
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1200" height="500" fill="#ffffff"/>
  <!-- Participantes -->
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">
    <text x="72" y="36">Usuário</text>
    <text x="264" y="36">Frontend</text>
    <text x="504" y="28">API</text>
    <text x="504" y="46">(generate-course-layout)</text>
    <text x="744" y="28">OpenAI</text>
    <text x="744" y="46">(texto)</text>
    <text x="936" y="28">OpenAI</text>
    <text x="936" y="46">(imagem)</text>
    <text x="1128" y="28">Banco de</text>
    <text x="1128" y="46">Dados</text>
  </g>
  <!-- Linhas de vida (yTop = 7.2 -> 60; yBot = 0 -> 492) -->
  <g stroke="#000000" stroke-width="1.2" stroke-dasharray="6,5">
    <line x1="72" y1="60" x2="72" y2="492"/>
    <line x1="264" y1="60" x2="264" y2="492"/>
    <line x1="504" y1="60" x2="504" y2="492"/>
    <line x1="744" y1="60" x2="744" y2="492"/>
    <line x1="936" y1="60" x2="936" y2="492"/>
    <line x1="1128" y1="60" x2="1128" y2="492"/>
  </g>
  <!-- Mensagens -->
  <g stroke="#000000" stroke-width="1.3" marker-end="url(#seta)">
    <line x1="72" y1="96" x2="264" y2="96"/>
    <line x1="264" y1="144" x2="504" y2="144"/>
    <line x1="504" y1="192" x2="744" y2="192"/>
    <line x1="744" y1="240" x2="504" y2="240"/>
    <line x1="504" y1="288" x2="936" y2="288"/>
    <line x1="936" y1="336" x2="504" y2="336"/>
    <line x1="504" y1="384" x2="1128" y2="384"/>
    <line x1="1128" y1="414" x2="504" y2="414"/>
    <line x1="504" y1="450" x2="264" y2="450"/>
    <line x1="264" y1="486" x2="72" y2="486"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#000000">
    <text x="168" y="90">preenche formulário e envia</text>
    <text x="384" y="138">POST /generate-course-layout</text>
    <text x="624" y="186">solicita estrutura do curso</text>
    <text x="624" y="234">retorna JSON (capítulos/tópicos)</text>
    <text x="720" y="282">solicita imagem de capa</text>
    <text x="720" y="330">retorna imagem gerada</text>
    <text x="816" y="378">salva curso</text>
    <text x="816" y="408">confirma gravação</text>
    <text x="384" y="444">retorna identificador do curso</text>
    <text x="168" y="480">exibe tela de revisão da estrutura</text>
  </g>
</svg>
