<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="Helvetica, Arial, sans-serif">
  <!-- Mesmo formato da Figura 3 do artigo (Etapa 1) -->
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="#ffffff"/>
  <!-- Participantes -->
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">
    <text x="72" y="36">Autor</text>
    <text x="264" y="36">Frontend</text>
    <text x="504" y="28">API</text>
    <text x="504" y="46">(generate-course-content)</text>
    <text x="744" y="28">OpenAI</text>
    <text x="744" y="46">(texto)</text>
    <text x="936" y="28">YouTube</text>
    <text x="936" y="46">Data API</text>
    <text x="1128" y="28">Banco de</text>
    <text x="1128" y="46">Dados</text>
  </g>
  <!-- Linhas de vida -->
  <g stroke="#000000" stroke-width="1.2" stroke-dasharray="6,5">
    <line x1="72" y1="60" x2="72" y2="572"/>
    <line x1="264" y1="60" x2="264" y2="572"/>
    <line x1="504" y1="60" x2="504" y2="572"/>
    <line x1="744" y1="60" x2="744" y2="572"/>
    <line x1="936" y1="60" x2="936" y2="572"/>
    <line x1="1128" y1="60" x2="1128" y2="572"/>
  </g>
  <!-- Fragmento paralelo -->
  <g stroke="#000000" stroke-width="1.2" fill="none">
    <rect x="440" y="236" width="560" height="200"/>
    <path d="M440,236 L490,236 L490,250 L480,258 L440,258"/>
    <line x1="440" y1="336" x2="1000" y2="336" stroke-dasharray="6,5"/>
  </g>
  <g font-size="12" fill="#000000">
    <text x="448" y="252" font-weight="bold">par</text>
    <text x="500" y="252">[para cada capítulo, em paralelo]</text>
    <text x="448" y="352">[se "Incluir vídeo" estiver marcado]</text>
  </g>
  <!-- Mensagens -->
  <g stroke="#000000" stroke-width="1.3" marker-end="url(#seta)">
    <line x1="72" y1="96" x2="264" y2="96"/>
    <line x1="264" y1="136" x2="504" y2="136"/>
    <line x1="504" y1="176" x2="1128" y2="176"/>
    <line x1="1128" y1="212" x2="504" y2="212"/>
    <line x1="504" y1="286" x2="744" y2="286"/>
    <line x1="744" y1="322" x2="504" y2="322"/>
    <line x1="504" y1="386" x2="936" y2="386"/>
    <line x1="936" y1="422" x2="504" y2="422"/>
    <line x1="504" y1="476" x2="1128" y2="476"/>
    <line x1="504" y1="516" x2="264" y2="516"/>
    <line x1="264" y1="556" x2="72" y2="556"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#000000">
    <text x="168" y="90">solicita a geração do conteúdo</text>
    <text x="384" y="130">POST /generate-course-content</text>
    <text x="816" y="170">busca o curso e confere o autor</text>
    <text x="816" y="206">retorna o curso</text>
    <text x="624" y="280">envia dados do capítulo revisado</text>
    <text x="624" y="316">retorna tópicos com conteúdo em HTML</text>
    <text x="720" y="380">busca até 4 vídeos pelo nome do capítulo</text>
    <text x="720" y="416">retorna vídeos (lista vazia em caso de falha)</text>
    <text x="816" y="470">salva o conteúdo do curso</text>
    <text x="384" y="510">retorna o conteúdo gerado</text>
    <text x="168" y="550">exibe o curso disponível</text>
  </g>
</svg>
